<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Poha | Mamra Pauva House
    </title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="mp-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="mp-header">


        <!-- HEADER TOP -->

        <div class="mp-header-top">


            <!-- BACK BUTTON -->

            <a
                href="index.html"
                class="mp-back"
                aria-label="Go back"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </a>


            <!-- STORE INFORMATION -->

            <div class="mp-location">

                <div class="mp-location-title">
                    Mamra Pauva House
                </div>

                <div class="mp-location-address">
                    Dharmyug Society, Vyara, Gujarat
                </div>

            </div>


            <!-- STORE LOGO -->

            <button
                type="button"
                class="mp-store-logo"
                aria-label="Mamra Pauva House"
            >
                M<br>
                PH
            </button>


            <!-- MENU -->

            <button
                type="button"
                class="mp-menu"
                aria-label="Open menu"
            >
                <i class="fa-solid fa-bars"></i>
            </button>


        </div>


        <!-- =================================================
             DELIVERY INFORMATION
        ================================================== -->

        


    </header>



    <!-- =====================================================
         MAIN CATEGORY PAGE
    ====================================================== -->

    <main class="mp-category-page">


        <!-- =================================================
             CATEGORY TITLE
        ================================================== -->

        <div class="mp-page-title">


            <div>

                <span class="mp-page-kicker">
                    CATEGORY
                </span>


                <h1 id="categoryTitle">
                    Poha
                </h1>


                <p id="categoryDescription">
                    Fresh poha and pauva for your daily needs.
                </p>

            </div>


        </div>



        <!-- =================================================
             CATEGORY NAVIGATION
        ================================================== -->

        <div
            class="mp-category-nav"
            id="categoryNav"
        >


            <!-- POHA -->

            <a
                href="category.html?category=poha"
                data-category="poha"
                class="active"
            >

                <span>
                    🍚
                </span>

                <span>
                    Poha
                </span>

            </a>


            <!-- RICE -->

            <a
                href="category.html?category=rice"
                data-category="rice"
            >

                <span>
                    🍚
                </span>

                <span>
                    Rice
                </span>

            </a>


            <!-- DAL -->

            <a
                href="category.html?category=dal"
                data-category="dal"
            >

                <span>
                    🫘
                </span>

                <span>
                    Dal
                </span>

            </a>


            <!-- FLOUR -->

            <a
                href="category.html?category=flour"
                data-category="flour"
            >

                <span>
                    🌾
                </span>

                <span>
                    Flour
                </span>

            </a>


            <!-- DAIRY -->

            <a
                href="category.html?category=dairy"
                data-category="dairy"
            >

                <span>
                    🥛
                </span>

                <span>
                    Dairy
                </span>

            </a>


            <!-- BISCUITS -->

            <a
                href="category.html?category=biscuits"
                data-category="biscuits"
            >

                <span>
                    🍪
                </span>

                <span>
                    Biscuits
                </span>

            </a>


            <!-- BEVERAGES -->

            <a
                href="category.html?category=beverages"
                data-category="beverages"
            >

                <span>
                    🥤
                </span>

                <span>
                    Beverages
                </span>

            </a>


            <!-- SNACKS -->

            <a
                href="category.html?category=snacks"
                data-category="snacks"
            >

                <span>
                    🍿
                </span>

                <span>
                    Snacks
                </span>

            </a>


        </div>



        <!-- =================================================
             PRODUCT HEADER
        ================================================== -->

      <div class="mp-products-header">

    <div>
        <h2 id="categoryProductsTitle">
            Poha
        </h2>

        <span id="categoryProductCount">
            8 products
        </span>
    </div>

    <button
        type="button"
        class="mp-sort-button"
        id="categorySortButton"
    >
        <i class="fa-solid fa-arrow-down-wide-short"></i>
        Sort
    </button>

</div>



        <!-- =================================================
             PRODUCTS
        ================================================== -->

        <section
            class="mp-category-products"
            id="categoryProducts"
            aria-label="Category products"
        >

            <!-- Products are generated by category.js -->


        </section>



        <!-- =================================================
             EMPTY RESULT
        ================================================== -->

        <div
            class="mp-category-empty"
            id="categoryEmpty"
            hidden
        >

            <div class="mp-category-empty-icon">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>

            <h3>
                No products found
            </h3>

            <p>
                Try searching for another product.
            </p>

        </div>


    </main>



    <!-- =====================================================
         STICKY SEARCH
         Appears above bottom navigation when scrolling
    ====================================================== -->

    <div
        class="mp-sticky-search"
        id="mpStickySearch"
    >

        <div class="mp-sticky-search-inner">


            <div class="mp-search-box">


                <i class="fa-solid fa-magnifying-glass"></i>


                <input
                    type="text"
                    id="mpStickySearchInput"
                    placeholder="Search Any Product..."
                    aria-label="Search products"
                >


                <button
                    type="button"
                    id="mpStickySearchClear"
                    aria-label="Clear search"
                >

                    <i class="fa-solid fa-xmark"></i>

                </button>


            </div>


        </div>

    </div>



    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="mp-bottom-nav">


        <a
            href="./index.html"
            class="mp-nav-item active"
        >

            <div class="mp-nav-icon">
                🏠
            </div>

            Home

        </a>


        <a
            href="./category.html"
            class="mp-nav-item"
        >

            <div class="mp-nav-icon">
                🛍️
            </div>

            Categories

        </a>


        <a
            href="#"
            class="mp-nav-item"
        >

            <div class="mp-nav-icon">
                🛒
            </div>

            Cart

        </a>


        <a
            href="#"
            class="mp-nav-item"
        >

            <div class="mp-nav-icon">
                📦
            </div>

            Orders

        </a>


        <a
            href="account.html"
            class="mp-nav-item"
        >

            <div class="mp-nav-icon">
                👤
            </div>

            Account

        </a>


    </nav>



</div>



<!-- =====================================================
     CATEGORY JAVASCRIPT
====================================================== -->

<script src="script.js"></script>


</body>

</html>
